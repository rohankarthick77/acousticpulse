image: gitpod/workspace-node-lts

ports:
  - port: 3000
    onOpen: open-browser
    visibility: public
  - port: 5001
    onOpen: ignore
    visibility: public

tasks:
  - init: npm install && npm run install:all && cd server && npx prisma generate && npx prisma db push && npm run seed && cd ..
    command: npm run dev
